<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيت التطوع - جامعة أسوان</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', 'Nunito Sans', sans-serif;
  }

  /* ===== الخلفية بالصورة الثابتة ===== */
  .background-img {
    background: url('3.jpeg') no-repeat center center fixed;
    -webkit-background-size: cover;
    -moz-background-size: cover;
    -o-background-size: cover;
    background-size: cover;
    min-height: 100vh;
    position: relative;
    padding: 40px 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* طبقة شفافة فوق الصورة عشان النص يبان */
  .background-img::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgb(0 0 0 / 57%);
    z-index: 0;
  }

  /* ===== المحتوى ===== */
  #wrap {
    position: relative;
    z-index: 10;
    text-align: center;
    width: 100%;
    max-width: 520px;
  }

  /* ===== اللوجوهات يمين وشمال ===== */
  .logos-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    gap: 15px;
  }

  .logos-row img {
    max-height: 90px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.4));
    border-radius: 12px;
    animation: logoFloat 4s ease-in-out infinite;
  }

  .logos-row img:last-child { animation-delay: -2s; }

  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* ===== العنوان ===== */
  h1 {
    position: relative;
    color: #fff;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.5px;
    line-height: 1.7;
    padding: 10px 0 15px;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
  }

  p {
    font-family: 'Cairo', 'Nunito Sans', sans-serif;
    font-size: 17px;
    color: #fff;
    margin-bottom: 10px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  }

  /* ===== زر السلايد ===== */
  .btn-slide {
    position: relative;
    display: inline-block;
    height: 55px;
    width: 280px;
    line-height: 55px;
    margin: 15px 0;
    padding: 0;
    border-radius: 28px;
    box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.7);
    background: linear-gradient(135deg, #e570e7 0%, #79f1fc 100%);
    text-decoration: none;
    overflow: hidden;
    transition: background 0.6s ease;
  }

  /* زر الفيسبوك */
  .btn-slide.facebook {
    background: linear-gradient(135deg, #1877f2 0%, #0a4fa8 100%);
  }

  /* زر الفورم */
  .btn-slide.form {
    background: linear-gradient(135deg, #7b2ff7 0%, #ff2e93 100%);
  }

  .btn-slide:active {
    box-shadow: 0 8px 16px -8px rgba(0, 0, 0, 0.7);
    transform: scale(0.97);
  }

  .btn-slide.facebook:active {
    background: linear-gradient(-135deg, #1877f2 0%, #0a4fa8 100%);
  }

  .btn-slide.form:active {
    background: linear-gradient(-135deg, #7b2ff7 0%, #ff2e93 100%);
  }

  /* الدايرة اللي بتتحرك */
  .btn-slide span.circle {
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #fff;
    color: #e570e7;
    position: absolute;
    margin: 5px;
    height: 45px;
    width: 45px;
    top: 0;
    left: 0;
    border-radius: 50%;
    transition: all 1.2s ease;
    font-size: 18px;
    z-index: 2;
  }

  .btn-slide.facebook span.circle { color: #1877f2; }
  .btn-slide.form span.circle { color: #7b2ff7; }

  .btn-slide:active span.circle {
    left: 100%;
    margin-left: -50px;
  }

  /* النص */
  .btn-slide span.title {
    font-family: 'Cairo', sans-serif;
    position: absolute;
    right: 85px;
    left: 60px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #fff;
    transition: all 0.6s ease;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .btn-slide span.title-active {
    opacity: 0;
    right: 50px;
    text-align: center;
  }

  .btn-slide:active span.title { opacity: 0; }
  .btn-slide:active span.title-active { opacity: 1; right: 85px; }

  /* ===== Footer ===== */
  footer {
    margin-top: 25px;
    color: rgba(255, 255, 255, 0.75);
    font-size: 13px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
  }

  /* ===== موبايل ===== */
  @media (max-width: 540px) {
    h1 { font-size: 20px; }
    p { font-size: 15px; }
    .btn-slide { width: 250px; height: 50px; line-height: 50px; }
    .btn-slide span.circle { height: 40px; width: 40px; font-size: 16px; }
    .btn-slide span.title { font-size: 15px; right: 75px; left: 55px; }
    .btn-slide span.title-active { right: 45px; }
    .btn-slide:active span.title-active { right: 75px; }
    .btn-slide:active span.circle { margin-left: -45px; }
    .logos-row img { max-height: 65px; }
  }
</style>
</head>
<body>

<section class="background-img">

  <div id="wrap">

    <!-- اللوجوهات يمين وشمال -->
    <div class="logos-row">
      <img src="1.jfif" alt="صندوق مكافحة وعلاج الإدمان والتعاطي">
      <img src="2.jpeg" alt="جامعة أسوان - بيت التطوع">
    </div>

    <!-- العنوان -->
    <h1>
      بيت التطوع<br>
      صندوق مكافحة وعلاج الإدمان والتعاطي<br>
      جامعة أسوان
    </h1>

    <p>اضغط على الرابط للانتقال</p>

    <!-- زر الفيسبوك -->
    <div>
      <a class="btn-slide facebook" href="https://www.facebook.com/share/1b2JHkpHou/" target="_blank" rel="noopener">
        <span class="circle">
          <i class="fa-brands fa-facebook-f"></i>
        </span>
        <span class="title">صفحتنا على فيسبوك</span>
        <span class="title title-active">تابعنا الآن</span>
      </a>
    </div>

    <!-- زر الفورم -->
    <div>
      <a class="btn-slide form" href="https://forms.gle/8ommKcn8Eu4pM7fv5" target="_blank" rel="noopener">
        <span class="circle">
          <i class="fa-solid fa-file-lines"></i>
        </span>
        <span class="title">سجّل معنا الآن</span>
        <span class="title title-active">املأ الفورم</span>
      </a>
    </div>

    <footer>© 2025 بيت التطوع - جامعة أسوان</footer>
  </div>

</section>

</body>
</html>
