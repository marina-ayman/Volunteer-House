<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيت التطوع - جامعة أسوان</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Cairo', sans-serif;
    background: #0a0a1a;
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
    cursor: none;
  }

  /* ===== الخلفية: صور ثابتة + طبقة ===== */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url('3.jpeg') no-repeat center center fixed;
    background-size: cover;
    filter: blur(0.5px) brightness(0.55);
    z-index: -3;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, rgb(16 20 25 / 0%), rgb(123 47 247 / 12%), rgb(255 255 255 / 0%));
    z-index: -2;
  }

  /* ===== موجات SVG متحركة ===== */
  .waves {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 220px;
    z-index: -1;
    pointer-events: none;
  }

  .waves svg {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%;
    height: 100%;
  }

  .wave1 { animation: waveMove 18s linear infinite; opacity: 0.35; }
  .wave2 { animation: waveMove 12s linear infinite reverse; opacity: 0.25; }
  .wave3 { animation: waveMove 22s linear infinite; opacity: 0.2; }

  @keyframes waveMove {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* ===== جزيئات متطايرة ===== */
  .particles {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0));
    animation: floatParticle linear infinite;
  }

  @keyframes floatParticle {
    0% {
      transform: translateY(100vh) scale(0);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translateY(-10vh) scale(1);
      opacity: 0;
    }
  }

  /* ===== المؤشر المخصص ===== */
  .cursor {
    position: fixed;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.9);
    pointer-events: none;
    z-index: 9999;
    mix-blend-mode: difference;
    transition: transform 0.1s ease, width 0.3s ease, height 0.3s ease;
    transform: translate(-50%, -50%);
  }

  .cursor.grow {
    width: 60px;
    height: 60px;
    background: rgba(255, 46, 147, 0.6);
  }

  /* ===== البطاقة الرئيسية ===== */
  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 500px;
    padding: 40px 30px;
    background: rgba(0, 0, 0, 0.502);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 30px;
    box-shadow:
      0 25px 70px rgba(0, 0, 0, 0.5),
      inset 0 1px 1px rgba(255, 255, 255, 0.3);
    text-align: center;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    animation: cardEnter 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes cardEnter {
    from {
      opacity: 0;
      transform: translateY(60px) rotateX(-15deg);
    }
    to {
      opacity: 1;
      transform: translateY(0) rotateX(0deg);
    }
  }

  /* خط ضوئي بيلف حول البطاقة */
  /* .card::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 32px;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      #00c6ff 60deg,
      #7b2ff7 120deg,
      #ff2e93 180deg,
      #00ffa3 240deg,
      transparent 300deg
    );
    z-index: -1;
    animation: borderSpin 6s linear infinite;
    opacity: 0.7;
  } */

  @keyframes borderSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ===== اللوجوهات ===== */
  .logos-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    gap: 15px;
    perspective: 800px;
  }

  .logo-box {
    width: 110px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 20px;
    backdrop-filter: blur(10px);
    transition: transform 0.5s ease, box-shadow 0.5s ease;
    animation: logoOrbit 6s ease-in-out infinite;
  }

  .logo-box:nth-child(2) {
    animation-delay: -3s;
  }

  .logo-box:hover {
    transform: scale(1.15) rotateY(15deg);
    box-shadow: 0 0 30px rgba(0, 198, 255, 0.6);
  }

  .logo-box img {
    max-width: 85%;
    max-height: 85%;
    object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
  }

  @keyframes logoOrbit {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-8px) rotate(2deg); }
    75% { transform: translateY(8px) rotate(-2deg); }
  }

  /* ===== العنوان ===== */
  h1 {
    font-size: 1.3rem;
    line-height: 1.9;
    font-weight: 900;
    margin-bottom: 12px;
    color: #fff;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  }

  h1 span {
    display: inline-block;
    background: linear-gradient(90deg, #00c6ff, #7b2ff7, #ff2e93, #00ffa3, #00c6ff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientMove 4s linear infinite;
    font-weight: 900;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  /* ===== النص الفرعي بنوع Typewriter ===== */
  .subtitle {
    color: rgba(255, 255, 255, 0.75);
    font-size: 0.95rem;
    margin-bottom: 30px;
    height: 1.4em;
    direction: rtl;
  }

  .subtitle .typed {
    display: inline-block;
    border-left: 2px solid #00c6ff;
    padding-left: 4px;
    animation: blink 0.8s step-end infinite;
  }

  @keyframes blink {
    50% { border-color: transparent; }
  }

  /* ===== الأزرار الجديدة ===== */
  .btn-new {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    height: 60px;
    margin-bottom: 18px;
    padding: 6px;
    border-radius: 50px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    text-decoration: none;
    color: #fff;
    overflow: hidden;
    transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    cursor: none;
  }

  /* توهج يمشي على الزر */
  .btn-new::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transition: left 0.7s ease;
  }

  .btn-new:hover::before {
    left: 100%;
  }

  /* أيقونة دائرية في اليمين */
  .btn-new .btn-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    color: #fff;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .btn-new .btn-icon::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px dashed rgba(255, 255, 255, 0.4);
    animation: rotateDash 8s linear infinite;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .btn-new:hover .btn-icon::after {
    opacity: 1;
  }

  @keyframes rotateDash {
    to { transform: rotate(360deg); }
  }

  /* النص */
  .btn-new .btn-label {
    flex: 1;
    text-align: right;
    padding: 0 15px;
    font-size: 1.05rem;
    font-weight: 700;
    position: relative;
    z-index: 2;
    transition: transform 0.5s ease;
  }

  /* السهم */
  .btn-new .btn-arrow {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    font-size: 1rem;
    margin-left: 6px;
    position: relative;
    z-index: 2;
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
                background 0.5s ease;
  }

  /* زر الفيسبوك */
  .btn-new.facebook {
    background: linear-gradient(135deg, rgba(24, 119, 242, 0.25), rgba(10, 79, 168, 0.25));
  }

  .btn-new.facebook .btn-icon {
    background: linear-gradient(135deg, #1877f2, #0a4fa8);
    box-shadow: 0 0 20px rgba(24, 119, 242, 0.6);
  }

  .btn-new.facebook:hover {
    background: linear-gradient(135deg, rgba(24, 119, 242, 0.5), rgba(10, 79, 168, 0.5));
    border-color: rgba(24, 119, 242, 0.8);
    box-shadow: 0 15px 40px rgba(24, 119, 242, 0.5);
  }

  /* زر الفورم */
  .btn-new.form {
    background: linear-gradient(135deg, rgba(123, 47, 247, 0.25), rgba(255, 46, 147, 0.25));
  }

  .btn-new.form .btn-icon {
    background: linear-gradient(135deg, #7b2ff7, #ff2e93);
    box-shadow: 0 0 20px rgba(255, 46, 147, 0.6);
  }

  .btn-new.form:hover {
    background: linear-gradient(135deg, rgba(123, 47, 247, 0.5), rgba(255, 46, 147, 0.5));
    border-color: rgba(255, 46, 147, 0.8);
    box-shadow: 0 15px 40px rgba(255, 46, 147, 0.5);
  }

  /* تأثير الـ hover الكبير */
  .btn-new:hover {
    transform: translateY(-4px);
  }

  .btn-new:hover .btn-icon {
    transform: scale(1.15) rotate(-15deg);
  }

  .btn-new:hover .btn-label {
    transform: translateX(-8px);
  }

  .btn-new:hover .btn-arrow {
    transform: translateX(-6px) rotate(-45deg);
    background: #fff;
    color: #0a0a1a;
  }

  /* حركة دخول الأزرار */
  .btn-new:nth-of-type(1) { animation: btnIn 0.8s ease 0.5s both; }
  .btn-new:nth-of-type(2) { animation: btnIn 0.8s ease 0.7s both; }

  @keyframes btnIn {
    from { opacity: 0; transform: translateX(60px) scale(0.8); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }

  /* ===== Footer ===== */
  footer {
    margin-top: 25px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.8rem;
  }

  /* ===== موبايل ===== */
  @media (max-width: 540px) {
    .card { padding: 30px 20px; border-radius: 25px; }
    h1 { font-size: 1.05rem; }
    .logo-box { width: 85px; height: 85px; }
    .btn-new { height: 55px; }
    .btn-new .btn-icon { width: 42px; height: 42px; font-size: 1.1rem; }
    .btn-new .btn-label { font-size: 0.95rem; }
    .btn-new .btn-arrow { width: 38px; height: 38px; }
    .subtitle { font-size: 0.85rem; }
    body { cursor: auto; }
    .cursor { display: none; }
  }
</style>
</head>
<body>

  <!-- مؤشر مخصص -->
  <div class="cursor"></div>

  <!-- موجات SVG -->
  <div class="waves">
    <svg class="wave1" viewBox="0 0 1440 200" preserveAspectRatio="none">
      <path fill="#00c6ff" d="M0,100 C240,150 480,50 720,100 C960,150 1200,50 1440,100 L1440,200 L0,200 Z"></path>
    </svg>
    <svg class="wave2" viewBox="0 0 1440 200" preserveAspectRatio="none">
      <path fill="#7b2ff7" d="M0,120 C320,60 640,180 960,120 C1120,90 1280,150 1440,120 L1440,200 L0,200 Z"></path>
    </svg>
    <svg class="wave3" viewBox="0 0 1440 200" preserveAspectRatio="none">
      <path fill="#ff2e93" d="M0,140 C360,80 720,180 1080,140 C1260,120 1350,160 1440,140 L1440,200 L0,200 Z"></path>
    </svg>
  </div>

  <!-- الجزيئات -->
  <div class="particles" id="particles"></div>

  <!-- البطاقة -->
  <div class="card" id="card">

    <!-- اللوجوهات -->
    <div class="logos-row">
      <div class="logo-box">
        <img src="1.jfif" alt="صندوق مكافحة وعلاج الإدمان والتعاطي">
      </div>
      <div class="logo-box">
        <img src="2.jpeg" alt="جامعة أسوان - بيت التطوع">
      </div>
    </div>

    <!-- العنوان -->
    <h1>
      <span>بيت التطوع</span><br>
      صندوق مكافحة وعلاج الإدمان والتعاطي<br>
      جامعة أسوان
    </h1>

    <!-- النص الفرعي -->
    <p class="subtitle">
      <span class="typed" id="typed"></span>
    </p>

    <!-- زر الفيسبوك -->
    <a class="btn-new facebook" href="https://www.facebook.com/share/1b2JHkpHou/" target="_blank" rel="noopener">
      <span class="btn-icon">
        <i class="fa-brands fa-facebook-f"></i>
      </span>
      <span class="btn-label">صفحتنا على فيسبوك</span>
      <span class="btn-arrow">
        <i class="fa-solid fa-arrow-left"></i>
      </span>
    </a>

    <!-- زر الفورم -->
    <a class="btn-new form" href="https://forms.gle/8ommKcn8Eu4pM7fv5" target="_blank" rel="noopener">
      <span class="btn-icon">
        <i class="fa-solid fa-file-lines"></i>
      </span>
      <span class="btn-label">سجّل معنا الآن</span>
      <span class="btn-arrow">
        <i class="fa-solid fa-arrow-left"></i>
      </span>
    </a>

    <footer>© 2025 بيت التطوع - جامعة أسوان</footer>
  </div>

<script>
  /* ===== المؤشر المخصص ===== */
  const cursor = document.querySelector('.cursor');
  document.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });

  document.querySelectorAll('a, .logo-box, .btn-new').forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('grow'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('grow'));
  });

  /* ===== الجزيئات المتطايرة ===== */
  const particlesContainer = document.getElementById('particles');
  const colors = ['#00c6ff', '#7b2ff7', '#ff2e93', '#00ffa3', '#ffffff'];

  function createParticle() {
    const p = document.createElement('div');
    p.classList.add('particle');

    const size = Math.random() * 6 + 2;
    const left = Math.random() * 100;
    const duration = Math.random() * 8 + 6;
    const color = colors[Math.floor(Math.random() * colors.length)];

    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = left + '%';
    p.style.background = `radial-gradient(circle, ${color}, transparent)`;
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = Math.random() * 3 + 's';

    particlesContainer.appendChild(p);

    setTimeout(() => p.remove(), (duration + 3) * 1000);
  }

  setInterval(createParticle, 300);
  for (let i = 0; i < 15; i++) createParticle();

  /* ===== البطاقة 3D ===== */
  const card = document.getElementById('card');
  card.addEventListener('mousemove', (e) => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    const rotateY = ((x - centerX) / centerX) * 8;
    const rotateX = ((centerY - y) / centerY) * 8;

    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
  });

  card.addEventListener('mouseleave', () => {
    card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
  });

  /* ===== Typewriter ===== */
  const text = 'اضغط على الرابط للانتقال ✨';
  const typedEl = document.getElementById('typed');
  let index = 0;

  function type() {
    if (index < text.length) {
      typedEl.textContent += text.charAt(index);
      index++;
      setTimeout(type, 80);
    } else {
      setTimeout(() => {
        typedEl.textContent = '';
        index = 0;
        type();
      }, 2500);
    }
  }
  setTimeout(type, 1200);
</script>
</body>
</html>
